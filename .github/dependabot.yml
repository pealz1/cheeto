version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: docs
    groups:
      docs:
        patterns: ["*"]
    ignore:
      # Nextra pins the Next and React majors it supports; majors move together as one deliberate upgrade
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
