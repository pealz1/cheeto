name: Cheeto Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/nextjs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cheeto-docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "Build"
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "18.17.0"

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build
        working-directory: ./docs
        run: npm run build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v6
        with:
          name: cheeto-docs
          path: ./docs/out
          retention-days: 7
