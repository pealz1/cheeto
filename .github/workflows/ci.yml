name: Cheeto CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: cheeto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint (stylua + selene)
    # GitHub-hosted runners are blocked on this account (billing), so this
    # job must stay on the self-hosted PEALZ runner. See CONTRIBUTING notes.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reset rokit auth (persistent self-hosted runner state)
        run: rm -f "$HOME/.rokit/auth.toml"

      - name: Install Rokit tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check formatting
        run: stylua --check src test benchmark plugin

      - name: Run Selene
        run: selene src test benchmark plugin
