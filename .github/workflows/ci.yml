name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check formatting
        run: stylua --check src test benchmark plugin extras

      - name: Run selene
        run: selene src test benchmark plugin

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Run the test suite
        working-directory: test
        run: lune run Test --ci

      - name: Check the wire lockfile
        run: lune run src/CLI/init.luau test/Sources/Test -- --check-lock --yes

      - name: Run the hardening checklist
        run: lune run src/CLI/init.luau test/Sources/HardeningGood -- --hardening-checklist --yes

      - name: Compile every schema example in the docs
        run: node docs/scripts/check-examples.mjs

      - name: Check the reference covers the compiler
        run: node docs/scripts/check-reference.mjs

      - name: Type-check the generated TypeScript definitions
        run: node docs/scripts/check-typescript.mjs
